name: Delivery policy
on:
  pull_request:
    paths:
      - 'delivery/**'
      - '.github/workflows/delivery-policy.yml'
  push:
    branches: [main]
    paths:
      - 'delivery/**'
      - '.github/workflows/delivery-policy.yml'
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s delivery/v1/tests -v
