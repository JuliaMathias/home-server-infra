name: shared-generation-trial
services:
  generation:
    image: ${GENERATION_IMAGE:?Set an immutable official llama.cpp server image digest}
    init: true
    restart: "no"
    user: "1000:1000"
    command:
      - --model
      - "${GENERATION_MODEL_PATH:-/models/qwen3-14b/Qwen3-14B-Q5_K_M.gguf}"
      - --alias
      - "${GENERATION_MODEL_ALIAS:-qwen3-14b-trial}"
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${GENERATION_CONTEXT_SIZE:-4096}"
      - --parallel
      - "1"
      - --threads
      - "4"
      - --threads-batch
      - "4"
      - --n-gpu-layers
      - "${GENERATION_GPU_LAYERS:-0}"
      - --jinja
      - --reasoning
      - "${GENERATION_REASONING:-off}"
      - --reasoning-budget
      - "${GENERATION_REASONING_BUDGET:-0}"
      - --no-context-shift
      - --n-predict
      - "${GENERATION_OUTPUT_LIMIT:-768}"
    environment:
      # Host-RAM prompt cache (llama.cpp default 8192 MiB). Large dense models need it
      # lowered or disabled so their weights stay resident; see README.
      LLAMA_ARG_CACHE_RAM: "${GENERATION_CACHE_RAM_MIB:-8192}"
    volumes:
      - /srv/lara/ai/models:/models:ro
    networks:
      lara-backend:
        aliases:
          - generation-trial
    cpus: 4
    mem_limit: ${GENERATION_MEMORY_LIMIT:-16g}
    memswap_limit: ${GENERATION_MEMORY_LIMIT:-16g}
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "2"
networks:
  lara-backend:
    external: true
