name: shared-transcription
services:
  transcription:
    image: home-server-transcription:local
    build:
      context: .
      target: runtime
    init: true
    restart: unless-stopped
    user: "1000:1000"
    environment:
      DATA_DIR: /data
      MODEL_PATH: /models/large-v3
      MODEL_REVISION: edaa852ec7e145841d8ffdb056a99866b5f0a478
      DEVICE: cuda
      COMPUTE_TYPE: int8_float16
      MAX_UPLOAD_BYTES: "536870912"
      MAX_PENDING: "4"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes:
      - /srv/lara/ai/models:/models:ro
      - /srv/lara/ai/data/transcription:/data
    networks:
      lara-backend:
        aliases:
          - transcription
    gpus: all
    mem_limit: 12g
    cpus: 4
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
networks:
  lara-backend:
    external: true
